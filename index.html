    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How does this rent vs buy calculator work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It models two scenarios over the same time horizon: buying a property with a mortgage (accounting for stamp duty, LMI, maintenance, council rates and selling costs), and renting while investing the deposit plus the ongoing difference between mortgage and rental costs. It then compares the final net wealth of each scenario."
            }
          },
          {
            "@type": "Question",
            "name": "Where does the stamp duty data come from?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Stamp duty rates are fetched live from each state revenue office's published rate page (NSW, VIC, QLD, WA, SA and ACT). If a live fetch fails, the calculator falls back to the most recent successfully fetched value, or a built-in indicative rate."
            }
          },
          {
            "@type": "Question",
            "name": "Where does the mortgage rate come from?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The default mortgage rate is the Reserve Bank of Australia's published average discounted owner-occupier variable rate, updated monthly. It can be edited to model any rate."
            }
          },
          {
            "@type": "Question",
            "name": "Is this financial advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. This calculator provides indicative estimates for educational purposes only, based on user-supplied assumptions about property growth, rent growth and investment returns. It is not financial advice and does not account for individual circumstances, taxes, or concessions such as first home buyer schemes."
            }
          }
        ]
      }
